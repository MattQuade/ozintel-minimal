name: Deploy to Fly

on:
  push:
    branches:
      - main

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ozintel-syd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Phones (AU mobile especially) often prefer IPv6. Desktop Wi‑Fi can still
      # work on IPv4 while phones hit "does not support a secure connection".
      # Force phones onto the known-good IPv4 path by releasing public IPv6.
      - name: Force IPv4-only public path for phones
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          flyctl ips list -a ozintel-syd
          curl -4 -fsS --max-time 20 -o /dev/null -w "ipv4:%{http_code}\n" https://ozintel.com.au/bottleshop
          flyctl ips list -a ozintel-syd -j > /tmp/ips.json
          python3 - <<'PY'
          import json, subprocess, sys
          raw = open("/tmp/ips.json").read().strip()
          print("ips raw:", raw[:2000])
          data = json.loads(raw)
          rows = data if isinstance(data, list) else (
              data.get("addresses") or data.get("ips") or data.get("data") or []
          )
          released = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              addr = str(row.get("address") or row.get("ip") or "").strip()
              typ = str(row.get("type") or row.get("kind") or row.get("family") or "").lower()
              region = str(row.get("region") or "")
              if not addr:
                  continue
              is_v6 = (":" in addr) or ("v6" in typ) or typ in (
                  "aaaa", "private_v6", "public_v6", "shared_v6"
              )
              if not is_v6:
                  continue
              # Keep private/machine networking; release public/shared v6 only.
              if "private" in typ and "public" not in typ and "shared" not in typ:
                  print("keeping private v6", addr, typ)
                  continue
              print("releasing", addr, typ, region, row)
              subprocess.check_call(
                  ["flyctl", "ips", "release", addr, "-a", "ozintel-syd", "-y"]
              )
              released += 1
          print(f"released={released}")
          if released == 0:
              # Fallback: release any address that looks like public IPv6 text.
              for row in rows:
                  addr = str((row or {}).get("address") or (row or {}).get("ip") or "")
                  if addr.count(":") >= 2:
                      print("fallback releasing", addr, row)
                      subprocess.check_call(
                          ["flyctl", "ips", "release", addr, "-a", "ozintel-syd", "-y"]
                      )
                      released += 1
              print(f"fallback_released={released}")
          PY
          flyctl ips list -a ozintel-syd
          dig +short ozintel.com.au A || true
          dig +short ozintel.com.au AAAA || true
