name: Deploy to Fly

on:
  push:
    branches:
      - main

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ozintel-syd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Smoke-check the public IPv4 path after deploy. Apex AAAA is managed at
      # nameserver.net.au (not Fly); keep www CNAME → fly.dev for phone IPv4.
      - name: Verify public bottle shop over IPv4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          flyctl ips list -a ozintel-syd
          curl -4 -fsS --max-time 20 -o /dev/null -w "apex:%{http_code}\n" https://ozintel.com.au/bottleshop
          curl -4 -fsS --max-time 20 -o /dev/null -w "www:%{http_code}\n" https://www.ozintel.com.au/bottleshop
