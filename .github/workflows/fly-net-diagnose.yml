name: Fly network diagnose

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list | release-ipv6 | allocate-ipv6"
        required: true
        default: "list"
        type: choice
        options:
          - list
          - release-ipv6
          - allocate-ipv6

jobs:
  diagnose:
    name: Fly IPs / phone path
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show status and IPs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          flyctl status -a ozintel-syd || true
          flyctl ips list -a ozintel-syd
          echo "---- ipv4 ----"
          curl -4 -sI --max-time 20 https://ozintel.com.au/bottleshop | head -20 || true
          echo "---- ipv6 ----"
          curl -6 -sI --max-time 20 https://ozintel.com.au/bottleshop | head -20 || true
      - name: Release IPv6 (force phones onto IPv4)
        if: ${{ inputs.action == 'release-ipv6' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          # Release every IPv6 address so mobile clients fall back to working IPv4.
          flyctl ips list -a ozintel-syd -j > /tmp/ips.json
          python3 - <<'PY'
          import json, subprocess, sys
          data = json.load(open("/tmp/ips.json"))
          rows = data if isinstance(data, list) else data.get("addresses") or data.get("ips") or []
          released = 0
          for row in rows:
              addr = row.get("address") or row.get("ip") or ""
              typ = str(row.get("type") or row.get("kind") or "").lower()
              if ":" in addr or "v6" in typ or typ == "aaaa":
                  print("releasing", addr, row)
                  subprocess.check_call(["flyctl", "ips", "release", addr, "-a", "ozintel-syd", "-y"])
                  released += 1
          if released == 0:
              print("No IPv6 addresses found to release; raw=", data)
              sys.exit(1)
          PY
          flyctl ips list -a ozintel-syd
          dig +short ozintel.com.au AAAA || true
      - name: Allocate private IPv6
        if: ${{ inputs.action == 'allocate-ipv6' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          flyctl ips allocate-v6 -a ozintel-syd -y || flyctl ips allocate v6 -a ozintel-syd -y
          flyctl ips list -a ozintel-syd
