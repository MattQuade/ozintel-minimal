name: Fly phone network fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fly-phone-net-fix.yml"

concurrency:
  group: fly-phone-net-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Phone-safe IPv4 only
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Keep dedicated IPv4 and remove public IPv6
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eux
          flyctl ips list -a ozintel-syd
          flyctl ips list -a ozintel-syd -j > /tmp/ips.json
          python3 - <<'PY'
          import json, subprocess, sys

          def pick(row, *names):
              lower = {str(k).lower(): v for k, v in row.items()}
              for name in names:
                  if name.lower() in lower and lower[name.lower()] not in (None, ""):
                      return str(lower[name.lower()])
              return ""

          rows = json.load(open("/tmp/ips.json"))
          if not isinstance(rows, list):
              rows = rows.get("addresses") or rows.get("Addresses") or []

          has_dedicated_v4 = False
          for row in rows:
              addr = pick(row, "address", "Address")
              typ = pick(row, "type", "Type").lower()
              print("seen", addr, typ)
              if typ == "v4" and addr and ":" not in addr:
                  has_dedicated_v4 = True
              if ":" in addr or typ == "v6":
                  print("releasing ipv6", addr)
                  subprocess.check_call(
                      ["flyctl", "ips", "release", "-a", "ozintel-syd", addr]
                  )

          if not has_dedicated_v4:
              print("allocating dedicated ipv4")
              subprocess.check_call(
                  ["flyctl", "ips", "allocate-v4", "-a", "ozintel-syd", "--yes"]
              )
          PY
          echo "==== final ips ===="
          flyctl ips list -a ozintel-syd
          echo "==== dns ===="
          dig +short ozintel.com.au A @1.1.1.1 || true
          dig +short ozintel.com.au AAAA @1.1.1.1 || true
          dig +short www.ozintel.com.au @1.1.1.1 || true
          dig +short ozintel-syd.fly.dev A @1.1.1.1 || true
          dig +short ozintel-syd.fly.dev AAAA @1.1.1.1 || true
          echo "==== http ===="
          curl -4 -fsS --max-time 25 -o /dev/null -w "apex:%{http_code}\n" https://ozintel.com.au/bottleshop
          curl -4 -fsS --max-time 25 -o /dev/null -w "www:%{http_code}\n" https://www.ozintel.com.au/bottleshop
